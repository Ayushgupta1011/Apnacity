<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <form action="">
            <p>
                <label for="city">City</label><input type="text" name="city" id="city">
            </p>

            <p>
                <label for="Area">Area</label><input type="text" name="Area" id="Area">
            </p>

            <p>
                <label for="Issue">Issue</label><input type="text" name="Issue" id="Issue">
            </p>

            <p>
                <label>Location</label>

                <input type="text" id="latitude" name="latitude" placeholder="Latitude" readonly>

                <input type="text" id="longitude" name="longitude" placeholder="Longitude" readonly>

                <button type="button" onclick="getLocation()">
    📍 Use My Current Location
</button>

                <p id="locationStatus"></p>
            </p>
        </form>

    </div>

    <script>
        function getLocation() {

            const status = document.getElementById("locationStatus");

            if (!navigator.geolocation) {
                status.textContent = "GPS is not supported by this browser.";
                return;
            }

            status.textContent = "Getting your location...";

            navigator.geolocation.getCurrentPosition(
                function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    document.getElementById("latitude").value =
                        latitude.toFixed(4);

                    document.getElementById("longitude").value =
                        longitude.toFixed(4);

                    status.textContent = "✓ Location captured successfully";

                },

                function(error) {

                    if (error.code === error.PERMISSION_DENIED) {
                        status.textContent =
                            "Location permission was denied.";
                    } else {
                        status.textContent =
                            "Unable to get your location.";
                    }
                }
            );
        }
        formData.append(
            "latitude",
            document.getElementById("latitude").value
        );

        formData.append(
            "longitude",
            document.getElementById("longitude").value
        );
    </script>
</body>

</html>
