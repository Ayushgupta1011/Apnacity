<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ApnaCity | Register an Issue</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dcefe5, #f4f8f5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
        }
        /* Logo */
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        
        .logo h2 {
            font-size: 28px;
            color: #176b4a;
            margin-top: 8px;
        }
        
        .logo p {
            color: #666;
            margin-top: 5px;
        }
        /* Main Card */
        
        .signup-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .signup-card h1 {
            text-align: center;
            color: #176b4a;
            margin-bottom: 10px;
            font-size: 27px;
        }
        
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }
        /* Form */
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .input-box {
            position: relative;
        }
        
        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #176b4a;
        }
        
        .input-box.textarea i {
            top: 20px;
            transform: none;
        }
        
        .input-box input,
        .input-box textarea {
            width: 100%;
            padding: 13px 13px 13px 42px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }
        
        .input-box textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.5;
        }
        
        .input-box input:focus,
        .input-box textarea:focus {
            border-color: #176b4a;
            box-shadow: 0 0 5px rgba(23, 107, 74, 0.2);
        }
        
        .input-box input[readonly] {
            background: #f4f8f5;
            color: #555;
        }
        /* Photo Upload */
        
        .photo-upload {
            border: 1px dashed #176b4a;
            background: #f4f8f5;
            border-radius: 10px;
            padding: 18px;
        }
        
        .photo-upload label {
            display: block;
            color: #176b4a;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .photo-upload input {
            width: 100%;
            font-size: 14px;
        }
        
        .photo-help {
            color: #777;
            font-size: 12px;
            margin-top: 8px;
        }
        /* Location */
        
        .coords {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .location-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: #e4f3e9;
            color: #176b4a;
            border: 1px dashed #176b4a;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .location-btn:hover {
            background: #d3ebdb;
        }
        
        .location-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        
        .status-text {
            margin-top: 10px;
            font-size: 13px;
            color: #176b4a;
            min-height: 18px;
        }
        
        .status-text.error {
            color: #c34242;
        }
        /* Submit Button */
        
        .signup-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            background: #176b4a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .signup-btn:hover {
            background: #104d35;
            transform: translateY(-2px);
        }
        
        .signup-btn:disabled {
            background: #8fb5a3;
            cursor: not-allowed;
            transform: none;
        }
        /* Result */
        
        .result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #e4f3e9;
            border-radius: 10px;
            color: #183d2d;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }
        /* Links */
        
        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }
        
        .login-link a {
            color: #176b4a;
            text-decoration: none;
            font-weight: bold;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
            line-height: 1.8;
        }
        
        @media(max-width: 480px) {
            .signup-card {
                padding: 25px 20px;
            }
            .signup-card h1 {
                font-size: 23px;
            }
            .coords {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body data-protected>

    <div class="container">

        <!-- Logo -->
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.jpeg" alt="ApnaCity Logo">
            </a>

            <h2>ApnaCity</h2>
            <p>Making Cities Better</p>
        </div>

        <!-- Report Form -->
        <div class="signup-card">

            <h1>Register an Issue</h1>

            <p class="subtitle">
                Tell us what's wrong in your area and we'll send it to the right department.
            </p>

            <form id="reportForm" method="POST">

                <!-- Photo Evidence -->
                <div class="form-group">
                    <div class="photo-upload">
                        <label for="photo">
                            <i class="fa-solid fa-camera"></i>
                            Upload Issue Photo (Optional)
                        </label>

                        <input type="file" id="photo" name="photo" accept="image/*">

                        <p class="photo-help">
                            Upload a clear photo of the civic issue.
                        </p>
                    </div>
                </div>

                <!-- City -->
                <div class="form-group">
                    <label for="city">City</label>

                    <div class="input-box">
                        <i class="fa-solid fa-city"></i>

                        <input type="text" name="city" id="city" placeholder="Enter your city" required>
                    </div>
                </div>

                <!-- Area -->
                <div class="form-group">
                    <label for="Area">Area</label>

                    <div class="input-box">
                        <i class="fa-solid fa-map-pin"></i>

                        <input type="text" name="Area" id="Area" placeholder="Enter your area or locality" required>
                    </div>
                </div>

                <!-- Issue -->
                <div class="form-group">
                    <label for="Issue">Describe Your Issue</label>

                    <div class="input-box textarea">
                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <textarea name="Issue" id="Issue" placeholder="Describe the issue (e.g. pothole on main road, garbage not collected)" required></textarea>
                    </div>
                </div>

                <!-- GPS Location -->
                <div class="form-group">

                    <label>Location</label>

                    <div class="coords">

                        <div class="input-box">
                            <i class="fa-solid fa-location-dot"></i>

                            <input type="text" id="latitude" name="latitude" placeholder="Latitude" readonly>
                        </div>

                        <div class="input-box">
                            <i class="fa-solid fa-location-dot"></i>

                            <input type="text" id="longitude" name="longitude" placeholder="Longitude" readonly>
                        </div>

                    </div>

                    <button type="button" class="location-btn" id="locationBtn" onclick="getLocation()">
                        <i class="fa-solid fa-crosshairs"></i>
                        Use My Current Location
                    </button>

                    <p id="locationStatus" class="status-text"></p>

                </div>

                <!-- Submit -->
                <button type="submit" class="signup-btn" id="submitBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                    Submit Report
                </button>

                <p id="submitStatus" class="status-text" style="text-align:center;"></p>

                <!-- Submission Result -->
                <div id="result" class="result"></div>

            </form>

            <!-- Tracking Link -->
            <div class="login-link">
                Already reported?
                <a href="Track_report_status.html">
                    Track your complaint
                </a>
            </div>

        </div>

        <footer>
            © 2026 ApnaCity. All Rights Reserved.
            <br> Together, Let's Make Our Cities Better.
        </footer>

    </div>

    <!-- Existing Authentication -->
    <script src="auth.js"></script>

    <!-- Existing Report Submission -->
    <script src="report.js"></script>

    <!-- GPS Function -->
    <script>
        function getLocation() {

            const status = document.getElementById("locationStatus");
            const latitude = document.getElementById("latitude");
            const longitude = document.getElementById("longitude");
            const locationBtn = document.getElementById("locationBtn");

            if (!navigator.geolocation) {
                status.textContent =
                    "Your browser does not support GPS location.";

                status.className = "status-text error";
                return;
            }

            status.textContent = "Detecting your location...";
            status.className = "status-text";

            locationBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    latitude.value = position.coords.latitude;
                    longitude.value = position.coords.longitude;

                    status.textContent =
                        "Location detected successfully! Accuracy: " +
                        Math.round(position.coords.accuracy) +
                        " metres.";

                    status.className = "status-text";

                    locationBtn.disabled = false;
                },

                function(error) {

                    let message = "";

                    switch (error.code) {

                        case error.PERMISSION_DENIED:
                            message =
                                "Location permission denied. Allow location access in your browser.";
                            break;

                        case error.POSITION_UNAVAILABLE:
                            message =
                                "Location information is unavailable.";
                            break;

                        case error.TIMEOUT:
                            message =
                                "Location request timed out. Please try again.";
                            break;

                        default:
                            message =
                                "Unable to detect your location.";
                    }

                    status.textContent = message;
                    status.className = "status-text error";

                    locationBtn.disabled = false;
                },

                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        }
    </script>

</body>

</html>
